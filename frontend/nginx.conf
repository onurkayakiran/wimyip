# SEO: JS calistirmayan bot'lari (Yandex, cogu yapay zeka crawler'i - GPTBot/
# ClaudeBot/PerplexityBot/CCBot vb. - ve Slackbot/Twitterbot gibi link-onizleme
# bot'lari) tespit eder. Bu bot'lar normalde her sayfada ayni bos SPA
# kabugunu (<div id="root">) gorurdu; asagidaki location bloklarinda bu
# istekler backend'in /api/seo/* dinamik-render endpoint'lerine (bkz.
# backend/app/api/routes/seo.py) ic yonlendiriliyor - gercek tarayicilar
# icin davranis birebir ayni kaliyor. Googlebot/Bingbot da bilerek dahil
# edildi: JS render etseler de bot-render edilmis yolu almalari render
# kuyruğu gecikmesini azaltir, veri fideliyetini dusurmez (ayni veri, sadece
# onceden render edilmis - Google'in resmi "dynamic rendering" deseni).
map $http_user_agent $is_bot {
    default 0;
    ~*(googlebot|bingbot|yandex(bot|images)?|duckduckbot|baiduspider|applebot) 1;
    ~*(gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|anthropic-ai|perplexitybot|ccbot|bytespider|amazonbot) 1;
    ~*(facebookexternalhit|facebot|twitterbot|slackbot|discordbot|linkedinbot|telegrambot|whatsapp|redditbot) 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NOT: proxy_pass'a duz "http://backend:8000/api/" yazilsaydi nginx
    # "backend" hostname'ini SADECE baslangicta cozup IP'yi kalici olarak
    # onbelleklerdi; backend container'i yeniden olusturuldugunda (yeni IP
    # aldiginda) nginx eski/olu IP'ye istek atmaya devam eder ve 502 doner.
    # Bunu onlemek icin proxy_pass'ta degisken kullanip her istekte DNS'i
    # yeniden coz duruyoruz - ama bunun icin resolver'in DOGRU adresi
    # bilmesi lazim. Bu adres ortama gore FARKLI (Docker Compose'da kendi
    # embedded DNS'i sabit olarak 127.0.0.11'de, Kubernetes'te ise
    # CoreDNS'in cluster'a ozgu bir ClusterIP'sinde) - bu yuzden burada
    # sabit bir IP yazmiyoruz; asagidaki degeri docker-entrypoint-resolver.sh
    # (bkz. Dockerfile) container baslarken /etc/resolv.conf'taki gercek
    # nameserver ile degistiriyor.
    resolver __DNS_RESOLVER__ valid=10s;

    location /api/ {
        # proxy_pass'ta degisken kullanildiginda (DNS'i istek anda yeniden
        # cozmek icin gerekli) nginx URI'yi ASLA yeniden yazmaz - orijinal
        # istek yolunu ("/api/..." dahil) oldugu gibi iletir. Bu yuzden
        # proxy_pass'a burada AYRICA bir "/api/" eklemiyoruz.
        # Asagidaki backend adresi docker-entrypoint-resolver.sh tarafindan
        # doldurulur: Docker Compose'da bare "backend", Kubernetes'te tam
        # nitelikli "backend.<namespace>.svc.cluster.local" (nginx'in
        # resolver'i search domain genisletmesi yapmadigi icin FQDN sart).
        set $backend_upstream __BACKEND_HOST__:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        # NOT: X-Real-IP'i kendi $remote_addr'imizla EZMIYORUZ - production'da
        # bu container'in onunde baska proxy katmanlari da olabiliyor (ornegin
        # Cloudflare -> sunucudaki nginx -> bu container). $remote_addr burada
        # sadece bir onceki hop'un (sunucu nginx'inin) adresi olurdu, gercek
        # ziyaretcinin degil. Bunun yerine zinciri SADECE genisletiyoruz -
        # boylece Cloudflare'in CF-Connecting-IP'si ve zaten var olan
        # X-Forwarded-For zinciri bozulmadan backend'e kadar ulasiyor.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ASN sitemap'i (asns koleksiyonundan canli uretiliyor - bkz.
    # backend/app/api/routes/sitemap.py) statik bir dosya DEGIL, bu yuzden
    # her istek backend'e yonlendiriliyor. Bot tespiti GEREKMIYOR (herkese
    # ayni icerik, koşulsuz) - sadece mevcut degismeyen `location /api/`
    # blogunu kullanan bir ic yonlendirme.
    location ~ ^/sitemap-asns(-\d+)?\.xml$ {
        # NOT: $1'i dogrudan asagidaki rewrite'in hedefinde kullanmiyoruz -
        # rewrite'in KENDI regex'i ($1 icermeyen "^") calistiginda nginx
        # $1'i o eslesmeye gore YENIDEN atar (bu location'in yakaladigi
        # deger kaybolur). Once ayri bir degiskene kaydedip rewrite'ta onu
        # kullanmak gerekiyor - bilinen bir nginx tuzagi.
        set $shard $1;
        rewrite ^ /api/sitemap-asns$shard.xml last;
    }

    # Bot tespit edilirse /api/seo/{home,ip,asn,domain,nameserver,prefix}'e
    # ic yonlendirir (`rewrite ... last`, ki `if` icinde `proxy_pass` ile
    # birlikte guvenilir olmayan tek istisna budur - nginx'in kendi
    # dokumantasyonunun onerdigi desen). Rewrite sonrasi nginx location
    # eslemesini YENIDEN yapar; yeni URI (`/api/seo/...`) yukaridaki
    # DEGISMEYEN `location /api/` bloguyla eslesir - ikinci bir proxy_pass/
    # resolver GEREKMEZ, ayni $backend_upstream mekanizmasi kullanilir.
    location = / {
        if ($is_bot) {
            rewrite ^ /api/seo/home last;
        }
        try_files $uri /index.html;
    }

    location ~ ^/(ip|asn|domain|nameserver|prefix)(/|$) {
        if ($is_bot) {
            rewrite ^ /api/seo$uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
