server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NOT: proxy_pass'a duz "http://backend:8000/api/" yazilsaydi nginx
    # "backend" hostname'ini SADECE baslangicta cozup IP'yi kalici olarak
    # onbelleklerdi; backend container'i yeniden olusturuldugunda (yeni IP
    # aldiginda) nginx eski/olu IP'ye istek atmaya devam eder ve 502 doner.
    # Bunu onlemek icin proxy_pass'ta degisken kullanip her istekte DNS'i
    # yeniden coz duruyoruz - ama bunun icin resolver'in DOGRU adresi
    # bilmesi lazim. Bu adres ortama gore FARKLI (Docker Compose'da kendi
    # embedded DNS'i sabit olarak 127.0.0.11'de, Kubernetes'te ise
    # CoreDNS'in cluster'a ozgu bir ClusterIP'sinde) - bu yuzden burada
    # sabit bir IP yazmiyoruz; asagidaki degeri docker-entrypoint-resolver.sh
    # (bkz. Dockerfile) container baslarken /etc/resolv.conf'taki gercek
    # nameserver ile degistiriyor.
    resolver __DNS_RESOLVER__ valid=10s;

    location /api/ {
        # proxy_pass'ta degisken kullanildiginda (DNS'i istek anda yeniden
        # cozmek icin gerekli) nginx URI'yi ASLA yeniden yazmaz - orijinal
        # istek yolunu ("/api/..." dahil) oldugu gibi iletir. Bu yuzden
        # proxy_pass'a burada AYRICA bir "/api/" eklemiyoruz.
        # Asagidaki backend adresi docker-entrypoint-resolver.sh tarafindan
        # doldurulur: Docker Compose'da bare "backend", Kubernetes'te tam
        # nitelikli "backend.<namespace>.svc.cluster.local" (nginx'in
        # resolver'i search domain genisletmesi yapmadigi icin FQDN sart).
        set $backend_upstream __BACKEND_HOST__:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        # NOT: X-Real-IP'i kendi $remote_addr'imizla EZMIYORUZ - production'da
        # bu container'in onunde baska proxy katmanlari da olabiliyor (ornegin
        # Cloudflare -> sunucudaki nginx -> bu container). $remote_addr burada
        # sadece bir onceki hop'un (sunucu nginx'inin) adresi olurdu, gercek
        # ziyaretcinin degil. Bunun yerine zinciri SADECE genisletiyoruz -
        # boylece Cloudflare'in CF-Connecting-IP'si ve zaten var olan
        # X-Forwarded-For zinciri bozulmadan backend'e kadar ulasiyor.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
