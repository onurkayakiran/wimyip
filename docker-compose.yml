services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    # MONGO_URI ayni host'ta ama AYRI bir compose projesinde calisan bir
    # mongo'yu (orn. mongo-external/) isaret ediyorsa "localhost" container'in
    # kendi loopback'i olur, mongo'ya ulasmaz. host-gateway, container'dan
    # host makinenin kendisine giden gercek bir yol sagliyor.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    # Varsayilan concurrency host CPU sayisina esittir (bu makinede 14) - bu
    # gereksiz yuksekti ve baslangicta ayni index'leri kurmaya calisan alt
    # sureclerin birbirine girmesine yol aciyordu (index olusturma artik
    # yarisa dayanikli, o sorun cozuldu). AMA concurrency=2 cok DUSUK
    # cikti: bu kuyrukta 6 farkli periyodik gorev var (rdap-asn, rdap-prefix,
    # bgp, peeringdb, ct-log, dns-history) - concurrency=2 iken ct-log gibi
    # sik calisan (2 dk) bir gorev sureki bir slotu kapatip digerlerinin
    # (5 dk'lik) aclikta kalmasina (saatlerce calismamasina) yol acti.
    # Gorevler kendi icinde seri/hiz-sinirli olsa da, BIRBIRINDEN BAGIMSIZ
    # 6 gorevin ayni anda calisabilmesi gerekiyor.
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-6}
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started

  unbound:
    image: mvance/unbound:latest
    restart: unless-stopped
    volumes:
      - unbound_data:/opt/unbound/etc/unbound

  ptr-worker:
    build: ./backend
    restart: unless-stopped
    # PTR taramasi ayri bir kuyruktan (ptr) tuketilir, boylece yuksek hacimli
    # DNS taramasi RIR/RDAP/BGP/PeeringDB gorevlerini bloklamaz
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q ptr --concurrency=${PTR_WORKER_CONCURRENCY:-1}
    env_file: .env
    environment:
      PTR_RESOLVER_HOST: unbound
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      unbound:
        condition: service_started

  ptr-worker-country:
    build: ./backend
    restart: unless-stopped
    # TARGET_COUNTRY'ye (varsayilan TR) ait RIR-tahsisli IP bloklarini tarayip
    # uzerlerinde calisan domainleri kesfeder - global ptr-worker'dan bagimsiz
    # kendi kuyrugu (ptr-country) ve cursor'u (ptr_sweep_country:<ulke>) var.
    # Baska bir ulke icin bu servis bloğu farkli TARGET_COUNTRY/kuyruk adiyla
    # kopyalanabilir.
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q ptr-country --concurrency=1
    env_file: .env
    environment:
      PTR_RESOLVER_HOST: unbound
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      unbound:
        condition: service_started

  apex-worker-country:
    build: ./backend
    restart: unless-stopped
    # TARGET_COUNTRY'ye ait IP'lerde barinan, zaten domain_ip_history'de
    # bilinen domainlerden SADECE ana (apex, subdomain olmayan) olanlari
    # hedefleyip sync_domain_dns ile A/AAAA/NS/MX/TXT'sini tazeler.
    # ptr-worker-country'den ve dns_history_sync'ten tamamen bagimsiz, kendi
    # kuyrugu (apex-country) ve cursor'u var. IP taramasi yapmadigi icin
    # unbound'a bagimli degil.
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q apex-country --concurrency=1
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started

  monitor-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.monitor
    restart: unless-stopped
    # ICMP ping icin ham soket gerekiyor - worker-portscan (remote-worker/)
    # ile ayni desen: image'da SADECE python3 binary'sine setcap ile
    # taninmis bir yetki var, burada onu fiilen aktif ediyoruz. cap_drop:ALL
    # ile baslayip SADECE NET_RAW'i geri ekliyoruz.
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q monitor-checks --concurrency=${MONITOR_WORKER_CONCURRENCY:-4}
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started

  remote-api:
    build: ./remote-api
    restart: unless-stopped
    # Izole/dar-kapsamli bir servis: bu servis BILHASSA internete acik
    # olacak sekilde sertlestirilmis (token bazli auth, rate limit, katı
    # input dogrulama - bkz. remote-api/app). env_file KULLANMIYORUZ, sadece
    # asagidaki degiskenler aciqca veriliyor - boylece bu container'in
    # ortaminda ADMIN_PASSWORD/CELERY_BROKER_URL gibi sirlar hic bulunmuyor.
    # redis'e de kasitli olarak depends_on YOK - bu servis ona hic
    # erisemiyor, disariya sadece (harici) Mongo'ya baglaniyor.
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      MAX_BATCH_SIZE: ${REMOTE_API_MAX_BATCH_SIZE:-1000}
      CLAIM_LEASE_SECONDS: ${REMOTE_API_CLAIM_LEASE_SECONDS:-300}
      RATE_LIMIT_CLAIM_PER_MINUTE: ${REMOTE_API_RATE_LIMIT_CLAIM_PER_MINUTE:-20}
      RATE_LIMIT_SUBMIT_PER_MINUTE: ${REMOTE_API_RATE_LIMIT_SUBMIT_PER_MINUTE:-20}
      PORT_SCAN_LEASE_SECONDS: ${PORT_SCAN_LEASE_SECONDS:-21600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${REMOTE_API_PORT:-8002}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  redis_data:
  unbound_data:
