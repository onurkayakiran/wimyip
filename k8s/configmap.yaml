apiVersion: v1
kind: ConfigMap
metadata:
  name: wimyip-config
  namespace: wimyip
data:
  # Celery broker/backend - in-cluster redis Service
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"

  # RDAP zenginlestirme
  RDAP_RATE_LIMIT_SECONDS: "1.0"
  RDAP_BATCH_SIZE: "100"
  RDAP_SYNC_INTERVAL_SECONDS: "300.0"

  # RIPEstat / BGP
  RIPESTAT_RATE_LIMIT_SECONDS: "0.5"
  RIPESTAT_BATCH_SIZE: "50"
  BGP_SYNC_INTERVAL_SECONDS: "300.0"

  # PeeringDB
  PEERINGDB_RATE_LIMIT_SECONDS: "1.0"
  PEERINGDB_BATCH_SIZE: "100"
  PEERINGDB_SYNC_INTERVAL_SECONDS: "300.0"

  # Certificate Transparency log domain kesfi (kullanicinin .env override'i)
  CT_BATCH_SIZE: "1000"
  CT_LOG_SYNC_INTERVAL_SECONDS: "120.0"

  # PTR (reverse DNS) taramasi - kendi Unbound resolver'imiz uzerinden
  # (kullanicinin .env override'lari)
  PTR_RESOLVER_HOST: "unbound"
  PTR_RATE_LIMIT_SECONDS: "0.02"
  PTR_BATCH_SIZE: "200"
  PTR_SWEEP_INTERVAL_SECONDS: "60.0"

  # Ulke bazli PTR taramasi (ptr-worker-country)
  TARGET_COUNTRY: "TR"
  COUNTRY_PTR_BATCH_SIZE: "500"
  COUNTRY_PTR_RATE_LIMIT_SECONDS: "0.1"
  COUNTRY_SWEEP_INTERVAL_SECONDS: "60.0"

  # Ulke bazli APEX domain taramasi (apex-worker-country)
  APEX_COUNTRY_BATCH_SIZE: "50"
  APEX_COUNTRY_DOMAINS_PER_PREFIX: "200"
  APEX_COUNTRY_RATE_LIMIT_SECONDS: "0.2"
  APEX_COUNTRY_SWEEP_INTERVAL_SECONDS: "120.0"

  # A/AAAA/NS/MX/TXT periyodik yeniden dogrulama (kullanicinin .env override'lari)
  DNS_HISTORY_RATE_LIMIT_SECONDS: "0.08"
  DNS_HISTORY_BATCH_SIZE: "250"
  DNS_HISTORY_SYNC_INTERVAL_SECONDS: "300.0"

  # Anasayfa istatistik onbellegi
  STATS_REFRESH_INTERVAL_SECONDS: "300.0"

  # IP Tarama (SYN port scan) - artik sadece premium plandaki kullanicilara
  # acik (bkz. backend/app/api/routes/scans.py).
  PORTSCAN_DEFAULT_DELAY_SECONDS: "5.0"
  PORTSCAN_MAX_HOSTS: "256"
  MAX_ACTIVE_SCANS_PER_USER: "3"

  # Kullanici paneli - JWT suresi (dakika)
  JWT_EXPIRE_MINUTES: "10080"

  # Domain monitoring (HTTP/HTTPS/Ping) - plan bazli limitler. free->premium
  # gecisi /admin panelindeki Kullanicilar bolumunden yapilir.
  FREE_MAX_MONITORS: "5"
  PREMIUM_MAX_MONITORS: "100"
  MIN_MONITOR_INTERVAL_SECONDS: "60"
  DEFAULT_MONITOR_INTERVAL_SECONDS: "300"
  MONITOR_CHECK_BATCH_SIZE: "50"
  MONITOR_CHECK_TICK_SECONDS: "30.0"
  MONITOR_HTTP_TIMEOUT_SECONDS: "10.0"
  MONITOR_PING_TIMEOUT_SECONDS: "5.0"
  MONITOR_RESULT_RETENTION_DAYS: "30"

  # Durum degisimi e-posta bildirimi icin SMTP (kimlik bilgileri sir,
  # wimyip-secrets'ta - burada sadece sir OLMAYAN baglanti bilgileri).
  # Mailgun 587: duz baglanti + STARTTLS ile yukseltme (smtp_use_tls=true
  # zaten mailer.py'de bunu yapiyor, implicit TLS/SMTPS - port 465 - degil).
  SMTP_HOST: "smtp.mailgun.org"
  SMTP_PORT: "587"
  SMTP_FROM_ADDRESS: "postmaster@kelimeogren.com"
  SMTP_USE_TLS: "true"
