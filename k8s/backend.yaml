apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wimyip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/onurkayakiran/wimyip-backend:a91f3a14436a30673cbc700429106e9b1634c96c
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: wimyip-config
            - secretRef:
                name: wimyip-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wimyip
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
