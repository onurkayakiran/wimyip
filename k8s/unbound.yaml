apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unbound-data
  namespace: wimyip
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
  namespace: wimyip
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      # PVC'ler docker named volume'lerin aksine imajdaki mevcut dosyalari
      # otomatik kopyalamiyor - bos PVC, imajin gomulu varsayilan config'ini
      # (unbound.conf + include ettigi a-records/srv-records/forward-records)
      # gizliyor. Bu initContainer, ayni imajin kendi orijinal dosyalarini
      # (volume'u FARKLI bir path'e mount ederek gorunur tutup) PVC bosken
      # bir kereye mahsus PVC'ye kopyalar - Docker'in named volume'de yaptigi
      # ilk-kopyalama davranisinin k8s karsiligi.
      initContainers:
        - name: seed-config
          image: mvance/unbound:latest
          command:
            - sh
            - -c
            - |
              if [ -z "$(ls -A /seed 2>/dev/null)" ]; then
                cp -a /opt/unbound/etc/unbound/. /seed/
              fi
          volumeMounts:
            - name: data
              mountPath: /seed
      containers:
        - name: unbound
          image: mvance/unbound:latest
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/unbound/etc/unbound
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: unbound-data
---
apiVersion: v1
kind: Service
metadata:
  name: unbound
  namespace: wimyip
spec:
  selector:
    app: unbound
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
