apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unbound-data
  namespace: wimyip
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbound
  namespace: wimyip
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unbound
  template:
    metadata:
      labels:
        app: unbound
    spec:
      containers:
        - name: unbound
          image: mvance/unbound:latest
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/unbound/etc/unbound
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: unbound-data
---
apiVersion: v1
kind: Service
metadata:
  name: unbound
  namespace: wimyip
spec:
  selector:
    app: unbound
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
