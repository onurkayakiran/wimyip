apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: wimyip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worker
          image: ghcr.io/onurkayakiran/wimyip-backend:181da1d1df36d6a88fa06d177e2b0c8d0c57353f
          command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=6"]
          envFrom:
            - configMapRef:
                name: wimyip-config
            - secretRef:
                name: wimyip-secrets
